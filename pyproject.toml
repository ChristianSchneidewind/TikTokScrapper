[project]
name = "tiktok-scraper"
version = "0.1.0"
description = "TikTok Automation with Selenium"
requires-python = ">=3.12"

dependencies = [
  "asyncio>=3.4.3",
  "blinker<1.8.0",
  "dotenv>=0.9.9",
  "pillow>=11.3.0",
  "pip>=25.1.1",
  "playwright>=1.53.0",
  "pyexecjs>=1.5.1",
  "selenium",
  "selenium-wire>=5.1.0",
  "setuptools>=80.7.1",
  "tiktok-signature>=1.3",
  "tiktokapi>=7.1.0",
  "undetected-chromedriver",
  "webdriver-manager>=4.0.2",
]
